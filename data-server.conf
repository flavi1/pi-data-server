# =============================================================================
#  data-server.conf — pi-data-server (copié dans /etc/pi-data-server/)
#  Après modification :  sudo bash /opt/pi-data-server/install.sh
# =============================================================================

# --- HTTP : /media en lecture seule (public) --------------------------------
HTTP_PORT=8080

# --- FTP : /incoming en lecture/écriture, /media en lecture seule -----------
INCOMING_DIR=/incoming
FTP_ROOT=/srv/ftp            # racine « chroot » vue par le client FTP
# Compte FTP :
#   auto      = votre compte administrateur (celui créé par prepare.sh, uid 1000),
#               même identifiant et même mot de passe qu'en SSH
#   ftpuser   = (ou tout autre nom inexistant) compte dédié créé pour le FTP, sans
#               shell ni SSH, avec son propre mot de passe : sudo passwd ftpuser
#   <nom>     = un compte existant au choix
FTP_USER=auto
FTP_PASV_MIN=40000           # plage passive : à rediriger aussi sur la box
FTP_PASV_MAX=40100
# Adresse annoncée en mode passif pour les clients EXTÉRIEURS (IP publique ou
# nom DNS dynamique, ex. maison.duckdns.org). Vide = adresse locale de la Pi.
FTP_PASV_ADDRESS=
# FTPS (TLS explicite) obligatoire. Mettre « no » seulement pour un test en local.
FTP_TLS=yes

# --- Protection force brute (fail2ban sur le FTP) ---------------------------
FAIL2BAN=yes
